; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    tzapu/WiFiManager @ ^2.0.16-rc2 ; Check for latest stable version
    adafruit/Adafruit Fingerprint Sensor Library @ ^2.2.0
    thomasfredericks/Bounce2 @ ^2.71
    arduino-libraries/LiquidCrystal @ ^1.0.7
    adafruit/Adafruit SPIFlash @ ^4.2.0
    adafruit/Adafruit LittleFS @ ^1.0.8 
    bblanchon/ArduinoJson @ ^6.21.4 ; Or ^7.x.x if compatible with your code style

build_flags =
    -DCORE_DEBUG_LEVEL=0 ; Set to higher for more debug, 0 for none

; If you have specific flash chip, you might need to specify it for Adafruit_SPIFlash, e.g.
; -D ADAFRUIT_SPIFLASH_USE_QSPI_FLASH
; -D EXTERNAL_FLASH_DEVICES=W25Q128FV ; Example, check your chip