; platformio.ini
[env:esp32dev]
platform = espressif32
board = esp32dev ; Or your specific ESP32 board (e.g., esp32doit-devkit-v1)
framework = arduino
monitor_speed = 115200
; upload_port = COMx ; Replace with your actual COM port or /dev/ttyUSBx
; upload_protocol = esptool

; Build flags for various ESP32 configurations (e.g., to reduce flash size for OTA)
; -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO ; Uncomment for more verbose logging
; board_build.f_cpu = 240000000L ; Set CPU frequency if needed, default is usually 240MHz

; Library dependencies (from Arduino Library Manager or GitHub)
lib_deps =
    ; WiFiManager for easy WiFi setup
    bodmer/WiFiManager @ ^2.0.17-beta
    ; Adafruit Fingerprint Sensor Library
    adafruit/Adafruit Fingerprint Sensor Library @ ^3.3.2
    ; Bounce2 for button debouncing
    thomasfredericks/Bounce2 @ ^2.70.0
    ; LiquidCrystal for LCD display
    arduino-libraries/LiquidCrystal @ ^1.0.7
    ; ArduinoJson for handling JSON payloads (e.g., OTA responses)
    bblanchon/ArduinoJson @ ^6.21.5
    ; HTTPS support (usually included with Arduino ESP32 core, but good to be explicit)
    ; HTTPClient and WiFiClientSecure are typically part of framework-arduino-esp32
    ; mbedtls is part of framework-arduino-esp32 \
    ; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

